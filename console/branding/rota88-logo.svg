<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Icon Badge - Gold with Dark Navy 88 for Maximum Contrast -->
  <g transform="translate(6, 6)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#goldBadge)" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Bold 88 icon in dark navy inside gold badge -->
    <!-- First 8 -->
    <path d="M18 14 C 12 14, 8 18, 8 23 C 8 28, 13 30, 18 33 C 23 36, 28 38, 28 44 C 28 48, 24 51, 18 51 C 12 51, 8 47, 8 43" 
          fill="none" stroke="#0b132b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.8) translate(3, 2)" />
    <path d="M18 14 C 24 14, 28 18, 28 23 C 28 28, 23 30, 18 33 C 13 36, 8 38, 8 44 C 8 48, 12 51, 18 51 C 24 51, 28 47, 28 43" 
          fill="none" stroke="#0b132b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.8) translate(3, 2)" />

    <!-- Second 8 -->
    <path d="M35 14 C 29 14, 25 18, 25 23 C 25 28, 30 30, 35 33 C 40 36, 45 38, 45 44 C 45 48, 41 51, 35 51 C 29 51, 25 47, 25 43" 
          fill="none" stroke="#0b132b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.8) translate(3, 2)" />
    <path d="M35 14 C 41 14, 45 18, 45 23 C 45 28, 40 30, 35 33 C 30 36, 25 38, 25 44 C 25 48, 29 51, 35 51 C 41 51, 45 47, 45 43" 
          fill="none" stroke="#0b132b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.8) translate(3, 2)" />

    <!-- Mini GPS locator dot -->
    <circle cx="26" cy="11" r="3.5" fill="#0b132b" />
    <circle cx="26" cy="11" r="1.5" fill="#ffffff" />
  </g>

  <!-- Typography: ROTA in Crisp Pure White, 88 in Vivid Gold -->
  <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#ffffff">ROTA</text>
  <text x="162" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="1" fill="url(#goldText)">88</text>

  <!-- Subtitle Line in Bright Silver -->
  <text x="71" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3" fill="#cbd5e1">LOGÍSTICA &amp; ENTREGAS</text>
</svg>
