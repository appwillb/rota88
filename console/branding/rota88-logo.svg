<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Badge -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#logoBgGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#logoGold)" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Stylized 88 in Badge -->
    <path d="M22 18 C 15 18, 11 23, 11 29 C 11 35, 17 38, 22 42 C 28 45, 33 48, 33 55 C 33 60, 28 64, 22 64 C 15 64, 11 59, 11 53" 
          fill="none" stroke="url(#logoGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.7) translate(4, 2)" />
    <path d="M22 18 C 29 18, 33 23, 33 29 C 33 35, 27 38, 22 42 C 16 45, 11 48, 11 55 C 11 60, 16 64, 22 64 C 29 64, 33 59, 33 53" 
          fill="none" stroke="url(#logoGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.7) translate(4, 2)" />

    <path d="M42 18 C 35 18, 31 23, 31 29 C 31 35, 37 38, 42 42 C 48 45, 53 48, 53 55 C 53 60, 48 64, 42 64 C 35 64, 31 59, 31 53" 
          fill="none" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" transform="scale(0.7) translate(4, 2)" />
    <path d="M42 18 C 49 18, 53 23, 53 29 C 53 35, 47 38, 42 42 C 36 45, 31 48, 31 55 C 31 60, 36 64, 42 64 C 49 64, 53 59, 53 53" 
          fill="none" stroke="url(#logoGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.7) translate(4, 2)" />

    <!-- Pin head -->
    <circle cx="32" cy="15" r="4.5" fill="url(#logoGold)" filter="url(#logoGlow)" />
    <circle cx="32" cy="15" r="2" fill="#0b132b" />
  </g>

  <!-- Typography: ROTA 88 -->
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="url(#whiteGrad)">ROTA</text>
  <text x="194" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="1" fill="url(#logoGold)" filter="url(#logoGlow)">88</text>

  <!-- Subtitle Tagline -->
  <rect x="82" y="52" width="245" height="1.5" fill="url(#logoGold)" opacity="0.5" />
  <text x="83" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="3.5" fill="#94a3b8">SISTEMA DE GESTÃO &amp; ENTREGAS</text>
</svg>
