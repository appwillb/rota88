<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Road / Route Ribbon (88 infinity flow) -->
  <g transform="translate(10, 12)">
    <!-- First '8' loop (Top & Bottom) -->
    <path d="M36 26 C 24 26, 16 34, 16 44 C 16 54, 25 58, 36 64 C 47 70, 56 75, 56 86 C 56 96, 48 104, 36 104 C 24 104, 16 95, 16 85" 
          fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M36 26 C 48 26, 56 34, 56 44 C 56 54, 47 58, 36 64 C 25 70, 16 75, 16 86 C 16 96, 24 104, 36 104 C 48 104, 56 95, 56 85" 
          fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Second '8' loop overlapping -->
    <path d="M68 26 C 56 26, 48 34, 48 44 C 48 54, 57 58, 68 64 C 79 70, 88 75, 88 86 C 88 96, 80 104, 68 104 C 56 104, 48 95, 48 85" 
          fill="none" stroke="#fef08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <path d="M68 26 C 80 26, 88 34, 88 44 C 88 54, 79 58, 68 64 C 57 70, 48 75, 48 86 C 48 96, 56 104, 68 104 C 80 104, 88 95, 88 85" 
          fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- GPS Pin at intersection -->
    <circle cx="52" cy="20" r="10" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="52" cy="20" r="4.5" fill="#0b132b" />
    <!-- Pin stem -->
    <polygon points="48,27 56,27 52,36" fill="url(#goldGrad)" />
  </g>
</svg>
