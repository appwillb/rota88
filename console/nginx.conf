server {
    listen       4200;
    server_name  localhost;
    port_in_redirect off;
    absolute_redirect off;

    # Enable Gzip Compression for much faster page & module loads
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain application/javascript application/json application/x-javascript text/xml text/css font/woff2 application/wasm image/svg+xml;

    # Rota88 Custom Branding & Theme Assets
    location /branding/ {
        alias /usr/share/nginx/html/branding/;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /images/rota88-logo.svg {
        alias /usr/share/nginx/html/branding/rota88-logo.svg;
        add_header Content-Type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /images/rota88-icon.svg {
        alias /usr/share/nginx/html/branding/rota88-icon.svg;
        add_header Content-Type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /assets/rota88-theme.css {
        alias /usr/share/nginx/html/branding/rota88-theme.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache";
    }

    location = /assets/rota88-branding.js {
        alias /usr/share/nginx/html/branding/rota88-branding.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets (JS, CSS, images, fonts) for fast subsequent loads
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|svg|ico|wasm)$ {
        root   /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Redirecionamento automatico de rastreamento publico de pedidos
    location = /track-order {
        return 301 /~/track-order?$args;
    }

    # Serve static assets and Single Page Application (SPA) with Rota88 White-Label Injection
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;

        # Inject Rota88 branding CSS, JS and Favicon
        sub_filter '</head>' '<link rel="stylesheet" href="/assets/rota88-theme.css"><link rel="icon" type="image/svg+xml" href="/images/rota88-icon.svg"></head>';
        sub_filter '</body>' '<script src="/assets/rota88-branding.js"></script></body>';
        sub_filter '<title>Fleetbase</title>' '<title>Rota88 - Gestão & Entregas</title>';
        sub_filter '<title>Fleetbase Console</title>' '<title>Rota88 - Gestão & Entregas</title>';
        sub_filter_once off;
        sub_filter_types text/html;
    }

    # Serve runtime config with no cache
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }

    # Proxy internal API requests to the httpd gateway
    location ~ ^/(fleet-ops|storefront|ledger)/int/ {
        proxy_pass http://httpd:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /int/ {
        proxy_pass http://httpd:80/int/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy public API requests to the httpd gateway
    location ~ ^/(fleet-ops|storefront|ledger)/api/ {
        proxy_pass http://httpd:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://httpd:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy real-time WebSockets to socketcluster
    location /socketcluster/ {
        proxy_pass http://socket:8000/socketcluster/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
