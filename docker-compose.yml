services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    command: ["mysqld", "--skip-log-bin", "--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3306:3306"
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "mysql_data:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fleetbase_root_secret}
      MYSQL_DATABASE: "fleetbase"
      MYSQL_USER: ${DB_USERNAME:-fleetbase}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fleetbase_secret_pass}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 2
      SOCKETCLUSTER_BROKERS: 2
      SOCKETCLUSTER_OPTIONS: '{"origins":"*"}'

  scheduler:
    image: fleetbase/fleetbase-api:latest
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://${DB_USERNAME:-fleetbase}:${DB_PASSWORD:-fleetbase_secret_pass}@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  queue:
    image: fleetbase/fleetbase-api:latest
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: "mysql://${DB_USERNAME:-fleetbase}:${DB_PASSWORD:-fleetbase_secret_pass}@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  console:
    image: fleetbase/fleetbase-console:latest
    restart: unless-stopped
    ports:
      - "4200:4200"
    labels:
      - "traefik.http.services.console.loadbalancer.server.port=4200"
    environment:
      DISABLE_RUNTIME_CONFIG: "false"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json
    depends_on:
      - application
      - httpd

  application:
    restart: unless-stopped
    image: fleetbase/fleetbase-api:latest
    command: ["frankenphp", "run", "--config", "/fleetbase/Caddyfile"]
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - api_storage:/fleetbase/api/storage/app
    environment:
      ENVIRONMENT: production
      APP_NAME: "Fleetbase"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${API_DOMAIN:-http://api.82.29.62.95.sslip.io}
      DATABASE_URL: "mysql://${DB_USERNAME:-fleetbase}:${DB_PASSWORD:-fleetbase_secret_pass}@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.82.29.62.95.sslip.io}
      BROADCAST_DRIVER: socketcluster
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      MAIL_FROM_NAME: Fleetbase
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
      GOOGLE_MAPS_LOCALE: pt-BR
    depends_on:
      - database
      - cache
      - queue

  httpd:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "8001:80"
    depends_on:
      - application

volumes:
  mysql_data:
  redis_data:
  api_storage:
