version: "3.8"

services:
  # =========================================================================
  # 1. BANCO DE DADOS (MySQL 8.0 com suporte a GIS/Geolocalização)
  # =========================================================================
  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    command: ["mysqld", "--skip-log-bin", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - fleetbase_db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fleetbase_root_secret}
      MYSQL_DATABASE: fleetbase
      MYSQL_USER: ${DB_USERNAME:-fleetbase}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fleetbase_secret_pass}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. CACHE & FILAS (Redis)
  # =========================================================================
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    volumes:
      - fleetbase_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 3. WEBSOCKETS (SocketCluster para Rastreamento em Tempo Real)
  # =========================================================================
  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 2
      SOCKETCLUSTER_BROKERS: 2
      SOCKETCLUSTER_OPTIONS: '{"origins":"*"}'

  # =========================================================================
  # 4. MOTOR DA API (Backend Laravel / Octane / FrankenPHP)
  # =========================================================================
  application:
    restart: unless-stopped
    image: fleetbase/fleetbase-api:latest
    volumes:
      - fleetbase_api_storage:/fleetbase/api/storage/app
    environment:
      ENVIRONMENT: production
      APP_NAME: "Fleetbase"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${API_DOMAIN:-https://api.seudominio.com}
      DATABASE_URL: "mysql://${DB_USERNAME:-fleetbase}:${DB_PASSWORD:-fleetbase_secret_pass}@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache:6379
      REDIS_URL: tcp://cache:6379
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.seudominio.com}
      BROADCAST_DRIVER: socketcluster
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      MAIL_FROM_NAME: "Fleetbase"
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
      # Adicione sua chave Google Maps se for usar no Brasil:
      # GOOGLE_MAPS_API_KEY: ""
      # GOOGLE_MAPS_LOCALE: "pt-BR"
    depends_on:
      - database
      - cache

  # =========================================================================
  # 5. GATEWAY HTTP DA API (Nginx servindo a API publicamente)
  # =========================================================================
  httpd:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - application

  # =========================================================================
  # 6. FILAS DE PROCESSAMENTO (Queue Worker em segundo plano)
  # =========================================================================
  queue:
    image: fleetbase/fleetbase-api:latest
    command: ["php", "artisan", "queue:work", "--tries=3"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: "mysql://${DB_USERNAME:-fleetbase}:${DB_PASSWORD:-fleetbase_secret_pass}@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache:6379
      REDIS_URL: tcp://cache:6379
    depends_on:
      - database
      - cache
      - application

  # =========================================================================
  # 7. AGENDADOR DE TAREFAS (Scheduler / Cron)
  # =========================================================================
  scheduler:
    image: fleetbase/fleetbase-api:latest
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://${DB_USERNAME:-fleetbase}:${DB_PASSWORD:-fleetbase_secret_pass}@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache:6379
      REDIS_URL: tcp://cache:6379
    depends_on:
      - database
      - cache
      - application

  # =========================================================================
  # 8. PAINEL WEB DO CONSOLE (Frontend Ember.js / Nginx)
  # =========================================================================
  console:
    restart: unless-stopped
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    ports:
      - "4200:4200"
    environment:
      DISABLE_RUNTIME_CONFIG: "false"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json
    depends_on:
      - application
      - httpd

volumes:
  fleetbase_db_data:
    driver: local
  fleetbase_redis_data:
    driver: local
  fleetbase_api_storage:
    driver: local
